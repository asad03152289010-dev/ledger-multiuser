<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — spending tracker</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --sub:#8a8a8e;
    --blue:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500; --purple:#af52de;
    --line:#e5e5ea; --line2:#f0f0f2; --input-bg:#fbfbfd; --seg-bg:#e5e5ea; --seg-active:#ffffff;
  }
  body[data-theme="dark"]{
    --bg:#000000; --card:#1c1c1e; --text:#f2f2f7; --sub:#98989d;
    --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --purple:#bf5af2;
    --line:#38383a; --line2:#2c2c2e; --input-bg:#1c1c1e; --seg-bg:#1c1c1e; --seg-active:#3a3a3c;
  }
  body{transition:background .2s,color .2s;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Helvetica,Arial,sans-serif;}
  #app,#auth{max-width:520px;margin:0 auto;padding:20px 16px 70px;}
  h1{font-size:30px;font-weight:700;letter-spacing:-0.02em;margin:6px 0 2px;}
  .sub{color:var(--sub);font-size:14px;margin:0 0 20px;}
  .segmented{display:flex;background:var(--seg-bg);border-radius:10px;padding:3px;margin-bottom:20px;position:sticky;top:10px;z-index:5;}
  .seg{flex:1;text-align:center;padding:8px 4px;font-size:13px;font-weight:600;color:var(--sub);border-radius:8px;cursor:pointer;transition:all .15s;}
  .seg.active{background:var(--seg-active);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .panel{display:none;} .panel.active{display:block;animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .card{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .card h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--sub);margin:0 0 14px;}
  label{display:block;font-size:13px;font-weight:500;color:var(--sub);margin:14px 0 6px;}
  label:first-of-type{margin-top:0;}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--input-bg);font-size:15px;color:var(--text);font-family:inherit;appearance:none;-webkit-appearance:none;}
  select{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%238a8a8e"/></svg>');background-repeat:no-repeat;background-position:right 12px center;padding-right:30px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.15);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  button.primary{margin-top:16px;width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:12px;
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;}
  button.primary:active{opacity:.7;}
  button.linklike{background:none;border:none;color:var(--blue);font-size:13.5px;font-weight:500;cursor:pointer;margin-top:14px;width:100%;text-align:center;font-family:inherit;}
  .err{color:var(--red);font-size:12px;margin-top:6px;display:none;}
  .row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line2);}
  .row:last-child{border-bottom:none;}
  .icon-badge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#fff;margin-right:11px;flex-shrink:0;}
  .row-left{display:flex;align-items:center;min-width:0;}
  .row-text{min-width:0;}
  .payee{font-weight:590;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meta{color:var(--sub);font-size:12px;margin-top:1px;}
  .amt{font-weight:600;font-size:14.5px;white-space:nowrap;flex-shrink:0;margin-left:8px;}
  .amt.neg{color:var(--text);}
  .amt.pos{color:var(--green);}
  .droparea{border:1.5px dashed var(--line);border-radius:14px;padding:34px 16px;text-align:center;color:var(--sub);cursor:pointer;font-size:14px;background:var(--input-bg);}
  .droparea i{font-size:26px;display:block;margin-bottom:10px;color:var(--blue);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--sub);padding:5px 3px;border-bottom:1px solid var(--line);font-weight:600;}
  td{padding:6px 3px;border-bottom:1px solid var(--line2);vertical-align:middle;}
  .empty{text-align:center;padding:44px 10px;color:var(--sub);font-size:14px;}
  .empty i{font-size:32px;display:block;margin-bottom:10px;opacity:.5;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .stat .num{font-size:22px;font-weight:700;letter-spacing:-.01em;}
  .stat .lbl{font-size:12px;color:var(--sub);margin-top:2px;}
  .bar-row{margin-bottom:14px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-row .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px;}
  .bar-track{height:7px;background:var(--line2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;}
  .loading{text-align:center;padding:20px;color:var(--sub);font-size:13.5px;}
  select.cat{font-size:12px;padding:5px 22px 5px 6px;background-position:right 6px center;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(28,28,30,.92);
    color:#fff;padding:10px 18px;border-radius:20px;font-size:13.5px;font-weight:500;opacity:0;
    transition:opacity .25s;pointer-events:none;backdrop-filter:blur(6px);}
  .toast.show{opacity:1;}
  .chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;margin-top:3px;}
  .avatar-circle{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
  .switch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--line);border-radius:26px;transition:.2s;}
  .switch .slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;
    background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--blue);}
  .switch input:checked + .slider:before{transform:translateX(20px);}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line2);}
  .settings-row:last-child{border-bottom:none;}
  .settings-row .label{font-size:14.5px;font-weight:500;}
  .settings-row .sub{font-size:12px;color:var(--sub);margin-top:1px;}
  button.danger{background:var(--red);}
  button.secondary-btn{background:var(--card);color:var(--text);border:1px solid var(--line);}
  .warn-chip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--orange);margin-top:2px;}
  .del-btn{background:none;border:none;color:var(--sub);font-size:17px;padding:8px 4px 8px 10px;cursor:pointer;flex-shrink:0;min-width:32px;min-height:32px;}
  .del-btn:active{color:var(--red);}
  .dash{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .dash .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .dash .head .lbl{font-size:13px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .dash .big{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:2px 0 10px;}
  .dash .big.warn{color:var(--red);}
  .acct-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);}
  .acct-row:last-child{border-bottom:none;}
  .acct-name{font-size:13.5px;font-weight:590;}
  .acct-sub{font-size:11.5px;color:var(--sub);margin-top:1px;}
  .acct-amt{font-size:13.5px;font-weight:600;text-align:right;}
  .acct-amt.low{color:var(--red);}
  .bell-btn{position:fixed;bottom:24px;right:18px;width:46px;height:46px;border-radius:23px;
    background:var(--blue);color:#fff;border:none;display:flex;align-items:center;justify-content:center;
    font-size:19px;box-shadow:0 4px 12px rgba(0,122,255,.35);cursor:pointer;z-index:40;}
  .bell-btn.subscribed{background:var(--green);}
  .link{color:var(--blue);font-size:13px;font-weight:500;cursor:pointer;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .signout{font-size:13px;color:var(--sub);cursor:pointer;}
  #auth{display:none;}
  #app{display:none;}
</style>
</head>
<body>

<div id="auth">
  <h1>Ledger</h1>
  <p class="sub">Sign in to track your own spending, privately.</p>
  <div class="card">
    <h3 id="auth-title">Sign in</h3>
    <label style="margin-top:0">Email</label>
    <input type="email" id="auth-email" placeholder="you@example.com">
    <label>Password</label>
    <input type="password" id="auth-password" placeholder="At least 6 characters">
    <div class="err" id="auth-err"></div>
    <button class="primary" id="auth-submit">Sign in</button>
    <button class="linklike" id="auth-toggle">Don't have an account? Sign up</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1>Ledger</h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <div id="avatar-wrap"></div>
      <span class="signout" id="signout-btn">Sign out</span>
    </div>
  </div>
  <p class="sub">Every rupee, tracked — log it by hand or drop in a statement.</p>

  <div class="segmented">
    <div class="seg active" data-tab="log">Log</div>
    <div class="seg" data-tab="statement">Statement</div>
    <div class="seg" data-tab="summary">Summary</div>
    <div class="seg" data-tab="budget">Budget</div>
    <div class="seg" data-tab="settings">Settings</div>
  </div>

  <div class="panel active" id="panel-log">
    <div id="dashboard-wrap"></div>
    <div class="card">
      <h3>New payment</h3>
      <label>Date</label>
      <input type="date" id="f-date">
      <div class="row2">
        <div>
          <label>Amount (PKR)</label>
          <input type="number" step="1" id="f-amount" placeholder="0">
        </div>
        <div>
          <label>Paid from</label>
          <select id="f-source">
            <option value="">Choose account</option>
            <option>Alfalah Bank Limited</option>
            <option>UBL Bank Limited</option>
            <option>Easy Pesa Bank Limited</option>
            <option>Sada Pay Bank</option>
            <option value="__other__">Other…</option>
          </select>
          <input type="text" id="f-source-other" placeholder="Account name" style="display:none;margin-top:8px;">
        </div>
      </div>
      <label>Paid to</label>
      <input type="text" id="f-payee" placeholder="e.g. K-Electric">
      <label>Category</label>
      <select id="f-category">
        <option>Groceries</option><option>Utilities</option><option>Rent</option>
        <option>Transport</option><option>Dining</option><option>Shopping</option>
        <option>Health</option><option>Entertainment</option><option>Transfers</option>
        <option>Other</option>
        <option value="__new__">+ Add new category…</option>
      </select>
      <input type="text" id="f-category-new" placeholder="Name this category" style="display:none;margin-top:8px;">
      <label>Note (optional)</label>
      <input type="text" id="f-note" placeholder="Anything worth remembering">
      <div class="err" id="f-err"></div>
      <button class="primary" id="f-save">Save entry</button>
    </div>
    <div class="card" id="log-list"></div>
  </div>

  <div class="panel" id="panel-statement">
    <div class="card">
      <h3>Upload statement</h3>
      <div class="droparea" id="drop">
        <i class="ti ti-file-upload"></i>
        Drop a bank statement PDF here, or tap to choose one.
        <input type="file" accept="application/pdf" id="file-input" style="display:none;">
      </div>
      <div id="parse-status"></div>
    </div>
    <div id="preview-wrap"></div>
  </div>

  <div class="panel" id="panel-summary">
    <div id="summary-wrap"></div>
  </div>

  <div class="panel" id="panel-budget">
    <div id="budget-wrap"></div>
  </div>

  <div class="panel" id="panel-settings">
    <div id="settings-wrap"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<button class="bell-btn" id="bell-btn" aria-label="Enable phone notifications" title="Enable phone notifications" style="display:none;"><i class="ti ti-bell"></i></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ===== Fill these in with your Supabase project's values =====
const SUPABASE_URL = 'https://cfwesgjfagtyscknnchw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmd2VzZ2pmYWd0eXNja25uY2h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMTMxNjUsImV4cCI6MjEwMjc4OTE2NX0.PbRffKsmjN8vbW1OOQDCuolVZ4bIomoZcifxwVVdW8c';
const VAPID_PUBLIC_KEY = 'BFSUO6XPxPPRlnO3nFfret2MZpTS_f1JVeBZQLRmyqlKDib7AEMrCS7QtpcV_-91zSi-RR6y8gwKHKZN-ikGTtg';
// ================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let entries = [];
let budgets = {overall: 0, categories: {}};
let accounts = {};
let pendingParsed = [];
let profile = {avatar_url: null, theme: 'light'};
function currentMonthKey(){ return new Date().toISOString().slice(0,7); }
const KNOWN_BANKS = ['Alfalah Bank Limited','UBL Bank Limited','Easy Pesa Bank Limited','Sada Pay Bank'];

const CAT_COLOR = {
  Groceries:'#34c759', Utilities:'#ff9500', Rent:'#af52de', Transport:'#007aff',
  Dining:'#ff3b30', Shopping:'#ff2d55', Health:'#5ac8fa', Entertainment:'#ffcc00',
  Transfers:'#8e8e93', Other:'#a2845e'
};
const CAT_ICON = {
  Groceries:'ti-shopping-cart', Utilities:'ti-bolt', Rent:'ti-home', Transport:'ti-car',
  Dining:'ti-tools-kitchen-2', Shopping:'ti-bag', Health:'ti-heart', Entertainment:'ti-device-tv',
  Transfers:'ti-arrows-exchange', Other:'ti-dots'
};

const CUSTOM_CAT_COLORS = ['#5e7ce2','#e25e9e','#5ee2a8','#e2a05e','#9e5ee2','#e25e5e','#5ec4e2','#a8e25e'];
function colorForCategory(cat){
  if(CAT_COLOR[cat]) return CAT_COLOR[cat];
  let hash = 0;
  for(let i=0;i<cat.length;i++) hash = (hash * 31 + cat.charCodeAt(i)) >>> 0;
  return CUSTOM_CAT_COLORS[hash % CUSTOM_CAT_COLORS.length];
}
function iconForCategory(cat){ return CAT_ICON[cat] || 'ti-tag'; }
function allCategories(){
  const defaults = Object.keys(CAT_COLOR);
  const used = [...new Set(entries.map(e=>e.category).filter(Boolean))];
  return [...new Set([...defaults, ...used])];
}
function categoryOptionsHtml(selected){
  return allCategories().map(c=>`<option ${c===selected?'selected':''}>${escapeHtml(c)}</option>`).join('')
    + `<option value="__new__">+ Add new category…</option>`;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function fmt(n){ return 'Rs ' + Math.round(Math.abs(n)).toLocaleString('en-PK'); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===================== AUTH =====================
let isSignup = false;
document.getElementById('auth-toggle').addEventListener('click', () => {
  isSignup = !isSignup;
  document.getElementById('auth-title').textContent = isSignup ? 'Create account' : 'Sign in';
  document.getElementById('auth-submit').textContent = isSignup ? 'Sign up' : 'Sign in';
  document.getElementById('auth-toggle').textContent = isSignup ? 'Already have an account? Sign in' : "Don't have an account? Sign up";
});

document.getElementById('auth-submit').addEventListener('click', async () => {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const err = document.getElementById('auth-err');
  err.style.display = 'none';
  if(!email || password.length < 6){
    err.textContent = 'Enter a valid email and a password of at least 6 characters.';
    err.style.display = 'block';
    return;
  }
  const { error } = isSignup
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  if(error){
    err.textContent = error.message;
    err.style.display = 'block';
    return;
  }
  if(isSignup){
    toast('Account created — check your email if confirmation is required');
  }
  await enterApp();
});

document.getElementById('signout-btn').addEventListener('click', async () => {
  await sb.auth.signOut();
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth').style.display = 'block';
  document.getElementById('bell-btn').style.display = 'none';
});

let currentUserEmail = '';
async function enterApp(){
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('bell-btn').style.display = 'flex';
  const { data: userData } = await sb.auth.getUser();
  currentUserEmail = userData?.user?.email || '';
  await loadAll();
  setupPushNotifications();
}

async function checkSession(){
  const { data } = await sb.auth.getSession();
  if(data.session){ await enterApp(); }
  else{ document.getElementById('auth').style.display = 'block'; }
}

// ===================== DATA (Supabase) =====================
async function loadAll(){
  const [{data: e}, {data: b}, {data: a}, {data: p}] = await Promise.all([
    sb.from('entries').select('*').order('date', {ascending:false}),
    sb.from('budgets').select('*').eq('month_key', currentMonthKey()).maybeSingle(),
    sb.from('accounts').select('*'),
    sb.from('profiles').select('*').maybeSingle()
  ]);
  entries = (e || []).map(row => ({
    id: row.id, date: row.date, amount: Number(row.amount), source: row.source,
    payee: row.payee, category: row.category, note: row.note, origin: row.origin
  }));
  budgets = b ? { overall: Number(b.overall)||0, categories: b.categories || {} } : { overall: 0, categories: {} };
  accounts = {};
  (a || []).forEach(row => { accounts[row.name] = Number(row.balance); });
  profile = p ? { avatar_url: p.avatar_url, theme: p.theme || 'light' } : { avatar_url: null, theme: 'light' };
  applyTheme(profile.theme);
  renderLog(); renderSummary(); renderBudget(); renderDashboard(); renderSettings(); renderAvatar();
}

async function loadBudgetForMonth(monthKey){
  const { data: userData } = await sb.auth.getUser();
  const { data: b } = await sb.from('budgets').select('*').eq('user_id', userData.user.id).eq('month_key', monthKey).maybeSingle();
  return b ? { overall: Number(b.overall)||0, categories: b.categories || {} } : { overall: 0, categories: {} };
}

async function addEntry(entry){
  const { data: userData } = await sb.auth.getUser();
  const { error } = await sb.from('entries').insert({ ...entry, user_id: userData.user.id });
  if(error){ toast('Could not save'); return false; }
  return true;
}
async function deleteEntry(id){
  if(!confirm('Delete this entry? This can\'t be undone.')) return;
  await sb.from('entries').delete().eq('id', id);
  entries = entries.filter(e => e.id !== id);
  renderLog(); renderSummary(); renderBudget(); renderDashboard();
  toast('Entry deleted');
}
async function saveBudgetsToDb(){
  const { data: userData } = await sb.auth.getUser();
  await sb.from('budgets').upsert({ user_id: userData.user.id, month_key: currentMonthKey(), overall: budgets.overall, categories: budgets.categories });
}
async function saveAccountToDb(name, balance){
  const { data: userData } = await sb.auth.getUser();
  await sb.from('accounts').upsert({ user_id: userData.user.id, name, balance });
}

// ===================== RENDER: LOG =====================
function categoryAverage(category, excludeId){
  const spendEntries = entries.filter(e => e.category === category && e.amount < 0 && e.id !== excludeId);
  if(spendEntries.length < 3) return null;
  const total = spendEntries.reduce((s,e)=>s+Math.abs(e.amount),0);
  return total / spendEntries.length;
}

function renderLog(){
  const wrap = document.getElementById('log-list');
  if(entries.length === 0){
    wrap.innerHTML = `<div class="empty"><i class="ti ti-receipt-2"></i>No entries yet. Log your first payment above.</div>`;
    return;
  }
  const sorted = [...entries].sort((a,b)=> b.date.localeCompare(a.date));
  wrap.innerHTML = sorted.map(e => {
    const avg = e.amount < 0 ? categoryAverage(e.category, e.id) : null;
    const unusual = avg !== null && Math.abs(e.amount) > avg * 2.5;
    return `
    <div class="row">

async function handlePdf(file){
  const status = document.getElementById('parse-status');
  status.innerHTML = '<div class="loading">Reading statement…</div>';
  document.getElementById('preview-wrap').innerHTML = '';
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    let lines = [];
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      const rowMap = {};
      content.items.forEach(item => {
        const y = Math.round(item.transform[5]);
        rowMap[y] = (rowMap[y] || '') + item.str + ' ';
      });
      const rowYs = Object.keys(rowMap).map(Number).sort((a,b)=>b-a);
      rowYs.forEach(y => lines.push(rowMap[y].trim()));
    }
    const parsed = parseStatementLines(lines);
    status.innerHTML = parsed.length
      ? `<div class="loading">Found ${parsed.length} possible transactions. Review below before adding.</div>`
      : `<div class="loading">Couldn't confidently detect transaction lines. You can still log entries manually.</div>`;
    pendingParsed = parsed;
    renderPreview();
  }catch(e){
    status.innerHTML = `<div class="loading">Could not read that PDF. Try a different export or log manually.</div>`;
  }
}

function parseStatementLines(lines){
  const dateRe = /\b(\d{1,2}[\/\-. ](?:[A-Za-z]{3}|\d{1,2})[\/\-. ]\d{2,4}|[A-Za-z]{3}\s+\d{1,2},?\s+\d{2,4})\b/;
  const amtRe = /(-?(?:Rs\.?|PKR)?\s?\d{1,3}(?:,\d{3})*(?:\.\d{2})?)\s*(CR|DR)?\s*$/i;
  const out = [];
  lines.forEach(line => {
    const dm = line.match(dateRe);
    const am = line.match(amtRe);
    if(!dm || !am) return;
    let amount = parseFloat(am[1].replace(/[Rs.PKR,\s]/gi,''));
    if(isNaN(amount)) return;
    if(am[2] && am[2].toUpperCase() === 'CR') amount = Math.abs(amount);
    else if(!/^-/.test(am[1].trim())) amount = -Math.abs(amount);
    let desc = line.replace(dm[0],'').replace(am[0],'').trim();
    desc = desc.replace(/\s{2,}/g,' ').slice(0,80);
    if(!desc) return;
    out.push({date: dm[0], desc, amount});
  });
  return out.slice(0, 200);
}

function monthKey(dateStr){
  const d = new Date(dateStr);
  if(isNaN(d)) return 'Unknown';
  return d.toLocaleString('en-US',{month:'short', year:'numeric'});
}

function renderSummary(){
  const wrap = document.getElementById('summary-wrap');
  if(entries.length === 0){
    wrap.innerHTML = `<div class="empty"><i class="ti ti-chart-bar"></i>Nothing to summarize yet.</div>`;
    return;
  }
  const spend = entries.filter(e=>e.amount < 0);
  const totalSpend = spend.reduce((s,e)=>s+Math.abs(e.amount),0);
  const now = new Date();
  const thisMonthKey = now.toLocaleString('en-US',{month:'short',year:'numeric'});
  const thisMonthSpend = spend.filter(e => monthKey(e.date) === thisMonthKey).reduce((s,e)=>s+Math.abs(e.amount),0);
  const today = now.toISOString().slice(0,10);
  const todaySpend = spend.filter(e => e.date === today).reduce((s,e)=>s+Math.abs(e.amount),0);

  const byCat = {};
  spend.forEach(e => { byCat[e.category] = (byCat[e.category]||0) + Math.abs(e.amount); });
  const bySource = {};
  spend.forEach(e => { bySource[e.source] = (bySource[e.source]||0) + Math.abs(e.amount); });
  const maxCat = Math.max(...Object.values(byCat), 1);

  const byMonth = {};
  spend.forEach(e => { const k = monthKey(e.date); byMonth[k] = (byMonth[k]||0) + Math.abs(e.amount); });
  const monthEntries = Object.entries(byMonth).sort((a,b)=> new Date('1 '+a[0]) - new Date('1 '+b[0])).slice(-6);
  const maxMonth = Math.max(...monthEntries.map(m=>m[1]), 1);

  const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`
    <div class="bar-row">
      <div class="top"><span>${escapeHtml(cat)}</span><span class="amt">${fmt(amt)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(amt/maxCat*100).toFixed(0)}%;background:${colorForCategory(cat)}"></div></div>
    </div>`).join('');
  const sourceRows = Object.entries(bySource).sort((a,b)=>b[1]-a[1]).map(([src,amt])=>`
    <tr><td>${escapeHtml(src)}</td><td style="text-align:right" class="amt">${fmt(amt)}</td></tr>`).join('');
  const monthBars = monthEntries.map(([m,amt])=>`
    <div class="bar-row">
      <div class="top"><span>${m}</span><span class="amt">${fmt(amt)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(amt/maxMonth*100).toFixed(0)}%;background:var(--blue)"></div></div>
    </div>`).join('');

  wrap.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="num">${fmt(todaySpend)}</div><div class="lbl">Spent today</div></div>
      <div class="stat"><div class="num">${fmt(thisMonthSpend)}</div><div class="lbl">Spent this month</div></div>
      <div class="stat"><div class="num">${fmt(totalSpend)}</div><div class="lbl">Total spent</div></div>
      <div class="stat"><div class="num">${entries.length}</div><div class="lbl">Entries logged</div></div>
    </div>
    <div class="card"><h3>Last 6 months</h3>${monthBars}</div>
    <div class="card"><h3>By category</h3>${catRows}</div>
    <div class="card"><h3>By account</h3><table><tbody>${sourceRows}</tbody></table></div>
  `;
}

      <div class="row2">
        <button class="primary" id="ob-save">Save overall budget</button>
        ${overall > 0 ? `<button class="primary" id="ob-clear" style="background:var(--red);">Clear budget</button>` : ''}
      </div>
      ${overall > 0 ? `
        <div style="margin-top:16px;">
          <div class="top" style="display:flex;justify-content:space-between;font-size:13.5px;">
            <span>Spent ${fmt(totalSpentThisMonth)}</span>
            <span style="color:${remaining<0?'var(--red)':'var(--sub)'}">${remaining<0?'Over by '+fmt(remaining):'Left '+fmt(remaining)}</span>
          </div>
          <div class="bar-track" style="margin-top:6px;"><div class="bar-fill" style="width:${overallPct}%;background:${overallOver?'#ff3b30':'#34c759'}"></div></div>
        </div>` : ''}
    </div>
    <div class="card">
      <h3>Split by category <span style="text-transform:none;font-weight:400;">(optional)</span></h3>
      <p class="acct-sub" style="margin-bottom:12px;">Decide for yourself how much of your overall budget goes where.</p>
      <div class="row2">
        <div>
          <label style="margin-top:0">Category</label>
          <select id="b-cat">${categoryOptionsHtml()}</select>
          <input type="text" id="b-cat-new" placeholder="Name this category" style="display:none;margin-top:8px;">
        </div>
        <div>
          <label style="margin-top:0">Amount (PKR)</label>
          <input type="number" id="b-amount" placeholder="e.g. 20000">
        </div>
      </div>
      <button class="primary" id="b-save">Save category split</button>
      ${overall > 0 && catBudgetSum > 0 ? `<p class="acct-sub" style="margin-top:10px;${catBudgetSum>overall?'color:var(--red)':''}">Allocated so far: ${fmt(catBudgetSum)} of ${fmt(overall)}${catBudgetSum>overall?' — more than your overall budget':''}</p>` : ''}
    </div>
    <div class="card">
      <h3>This month — ${thisMonthKey}</h3>
      ${rows || '<p class="acct-sub">No category limits set yet.</p>'}
    </div>
  `;
  document.getElementById('ob-save').addEventListener('click', async () => {
    const amt = parseFloat(document.getElementById('ob-amount').value);
    if(isNaN(amt) || amt <= 0){ toast('Enter a valid amount'); return; }
    budgets.overall = amt;
    await saveBudgetsToDb();
    toast('Overall budget saved');
    renderBudget(); renderDashboard();
  });
  const clearBtn = document.getElementById('ob-clear');
  if(clearBtn){
    clearBtn.addEventListener('click', async () => {
      budgets.overall = 0;
      await saveBudgetsToDb();
      toast('Overall budget cleared');
      renderBudget(); renderDashboard();
    });
  }
  document.getElementById('b-cat').addEventListener('change', e => {
    document.getElementById('b-cat-new').style.display = e.target.value === '__new__' ? 'block' : 'none';
  });
  document.getElementById('b-save').addEventListener('click', async () => {
    let cat = document.getElementById('b-cat').value;

    const amt = parseFloat(document.getElementById('b-amount').value);
    if(!cat || isNaN(amt) || amt <= 0){ toast('Enter a category and a valid amount'); return; }
    budgets.categories = budgets.categories || {};
    budgets.categories[cat] = amt;
    await saveBudgetsToDb();
    toast('Category split saved');
    renderBudget();
  });
  wrap.querySelectorAll('.cat-budget-clear').forEach(btn => {
    btn.addEventListener('click', async () => {
      const cat = btn.dataset.cat;
      if(budgets.categories) delete budgets.categories[cat];
      await saveBudgetsToDb();
      toast('Category limit cleared');
      renderBudget();
    });
  });
}

const BANK_COLORS = {
  'Alfalah Bank Limited': '#a2845e', 'UBL Bank Limited': '#1f4d8c',
  'Easy Pesa Bank Limited': '#00a651', 'Sada Pay Bank': '#5e2ce2'
};
function colorForAccount(name){
  if(BANK_COLORS[name]) return BANK_COLORS[name];
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return CUSTOM_CAT_COLORS[hash % CUSTOM_CAT_COLORS.length];
}
function initialsForAccount(name){
  const words = name.replace(/Bank Limited|Bank/gi,'').trim().split(/\s+/).filter(Boolean);
  return (words[0]?.[0] || name[0] || '?').toUpperCase() + (words[1]?.[0] || '').toUpperCase();
}

async function deleteAccount(name){
  const { data: userData } = await sb.auth.getUser();
  await sb.from('accounts').delete().eq('user_id', userData.user.id).eq('name', name);
  delete accounts[name];
  toast('Balance cleared');
  renderDashboard();
}

  const allAccountNames = [...new Set([...KNOWN_BANKS, ...Object.keys(accounts), ...entries.map(e=>e.source)])].filter(Boolean);

  spend.forEach(e => { spentByAcct[e.source] = (spentByAcct[e.source]||0) + Math.abs(e.amount); });

  let budgetBlock = '';
  if(overall > 0){
    const remaining = overall - totalSpentThisMonth;

    let name = document.getElementById('acct-select').value;
    if(name === '__other__') name = document.getElementById('acct-other').value.trim();
    const bal = parseFloat(document.getElementById('acct-balance').value);
    if(!name || isNaN(bal)){ toast('Choose an account and enter a balance'); return; }
    accounts[name] = bal;
    await saveAccountToDb(name, bal);
    toast('Balance saved');
    renderDashboard();
  });
  wrap.querySelectorAll('.acct-clear-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteAccount(btn.dataset.name));
  });
}

// ===================== THEME =====================
function applyTheme(theme){
  document.body.dataset.theme = theme === 'dark' ? 'dark' : 'light';
}
async function saveProfile(fields){
  const { data: userData } = await sb.auth.getUser();
  profile = { ...profile, ...fields };
  await sb.from('profiles').upsert({ user_id: userData.user.id, avatar_url: profile.avatar_url, theme: profile.theme });
}

// ===================== AVATAR =====================
function initialsForUser(){
  const name = currentUserEmail.split('@')[0] || '?';
  return name.slice(0,2).toUpperCase();
}
function renderAvatar(){
  const wrap = document.getElementById('avatar-wrap');
  wrap.innerHTML = profile.avatar_url
    ? `<img class="avatar-circle" src="${profile.avatar_url}" alt="Profile photo">`
    : `<div class="avatar-circle">${initialsForUser()}</div>`;
}

async function uploadAvatar(file){
  const { data: userData } = await sb.auth.getUser();
  const path = `${userData.user.id}/avatar.png`;
  const { error: upErr } = await sb.storage.from('avatars').upload(path, file, { upsert: true, contentType: file.type });
  if(upErr){ toast('Could not upload photo'); return; }
  const { data: urlData } = sb.storage.from('avatars').getPublicUrl(path);
  const url = urlData.publicUrl + '?t=' + Date.now();
  await saveProfile({ avatar_url: url });
  renderAvatar();
  renderSettings();
  toast('Profile photo updated');
}

// ===================== EXPORT =====================
function monthLabel(monthKey){
  const [y,m] = monthKey.split('-');
  return new Date(Number(y), Number(m)-1, 1).toLocaleString('en-US',{month:'long', year:'numeric'});
}

function entriesForMonth(monthKey){
  return entries.filter(e => e.date && e.date.slice(0,7) === monthKey);
}

function exportMonthCSV(monthKey){
  const rows = entriesForMonth(monthKey);
  if(rows.length === 0){ toast('No entries for this month'); return; }
  let csv = 'Date,Payee,Account,Category,Amount (PKR),Note\n';
  rows.forEach(e => {
    csv += [e.date, e.payee, e.source, e.category, e.amount, (e.note||'').replace(/,/g,';')]
      .map(v => `"${String(v).replace(/"/g,'""')}"`).join(',') + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ledger-${monthKey}.csv`;
  a.click();
}

async function exportMonthPDF(monthKey){
  const rows = entriesForMonth(monthKey);
  if(rows.length === 0){ toast('No entries for this month'); return; }
  const spend = rows.filter(e=>e.amount<0);
  const total = spend.reduce((s,e)=>s+Math.abs(e.amount),0);
  const byCat = {};
  spend.forEach(e => { byCat[e.category] = (byCat[e.category]||0) + Math.abs(e.amount); });
  const b = monthKey === currentMonthKey() ? budgets : await loadBudgetForMonth(monthKey);

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;
  doc.setFontSize(18); doc.text('Ledger — ' + monthLabel(monthKey), 14, y); y += 10;
  doc.setFontSize(11);
  doc.text(`Total spent: Rs ${Math.round(total).toLocaleString('en-PK')}`, 14, y); y += 7;
  if(b.overall > 0){
    doc.text(`Budget: Rs ${Math.round(b.overall).toLocaleString('en-PK')}  ·  Remaining: Rs ${Math.round(b.overall-total).toLocaleString('en-PK')}`, 14, y);
    y += 7;
  }
  y += 4;
  doc.setFontSize(13); doc.text('By category', 14, y); y += 7;
  doc.setFontSize(10);
  Object.entries(byCat).sort((a,b)=>b[1]-a[1]).forEach(([cat, amt]) => {
    doc.text(`${cat}`, 14, y);
    doc.text(`Rs ${Math.round(amt).toLocaleString('en-PK')}`, 160, y, {align:'right'});
    y += 6;
  });
  y += 6;
  doc.setFontSize(13); doc.text('All entries', 14, y); y += 7;
  doc.setFontSize(9);
  rows.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
    if(y > 280){ doc.addPage(); y = 20; }
    doc.text(`${e.date}  ${e.payee}  (${e.category})`, 14, y);
    doc.text(`${e.amount<0?'-':'+'}Rs ${Math.round(Math.abs(e.amount)).toLocaleString('en-PK')}`, 195, y, {align:'right'});
    y += 6;
  });
  doc.save(`ledger-${monthKey}.pdf`);
}

// ===================== RESET / NEW MONTH =====================
async function resetThisMonth(){
  if(!confirm(`Delete all entries for ${monthLabel(currentMonthKey())}? This can't be undone.`)) return;
  const { data: userData } = await sb.auth.getUser();
  const mk = currentMonthKey();
  await sb.from('entries').delete().eq('user_id', userData.user.id).gte('date', mk+'-01').lt('date', mk+'-32');
  await loadAll();
  toast('This month\'s entries cleared');
}

async function resetAllData(){
  if(!confirm('This deletes ALL your entries, accounts, and budgets permanently. Are you absolutely sure?')) return;
  if(!confirm('Really sure? This cannot be undone.')) return;
  const { data: userData } = await sb.auth.getUser();
  await Promise.all([
    sb.from('entries').delete().eq('user_id', userData.user.id),
    sb.from('accounts').delete().eq('user_id', userData.user.id),
    sb.from('budgets').delete().eq('user_id', userData.user.id)
  ]);
  await loadAll();
  toast('All data reset');
}

function startNewMonth(){
  toast(`New month started — set a budget for ${monthLabel(currentMonthKey())} below.`);
  document.querySelectorAll('.seg').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelector('.seg[data-tab="budget"]').classList.add('active');
  document.getElementById('panel-budget').classList.add('active');
  renderBudget();
}

function pastMonthOptions(){
  const monthsWithData = [...new Set(entries.map(e => e.date && e.date.slice(0,7)).filter(Boolean))];
  const all = [...new Set([...monthsWithData, currentMonthKey()])].sort().reverse();
  return all;
}

async function renderHistoryFor(monthKey){
  const wrap = document.getElementById('history-detail');
  const rows = entriesForMonth(monthKey);
  const spend = rows.filter(e=>e.amount<0);
  const total = spend.reduce((s,e)=>s+Math.abs(e.amount),0);
  const byCat = {};
  spend.forEach(e => { byCat[e.category] = (byCat[e.category]||0) + Math.abs(e.amount); });
  const b = monthKey === currentMonthKey() ? budgets : await loadBudgetForMonth(monthKey);
  const maxCat = Math.max(...Object.values(byCat), 1);

  wrap.innerHTML = `
    <div class="stat-grid" style="margin-top:14px;">
      <div class="stat"><div class="num">${fmt(total)}</div><div class="lbl">Spent</div></div>
      <div class="stat"><div class="num">${b.overall > 0 ? fmt(b.overall) : '—'}</div><div class="lbl">Budget</div></div>
    </div>
    ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`
      <div class="bar-row">
        <div class="top"><span>${escapeHtml(cat)}</span><span class="amt">${fmt(amt)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(amt/maxCat*100).toFixed(0)}%;background:${colorForCategory(cat)}"></div></div>
      </div>`).join('') || '<p class="acct-sub">No spending recorded this month.</p>'}
  `;
}

function renderSettings(){
  const wrap = document.getElementById('settings-wrap');
  const months = pastMonthOptions();
  wrap.innerHTML = `
    <div class="card">
      <h3>Profile</h3>
      <div style="display:flex;align-items:center;gap:14px;">
        <div id="settings-avatar"></div>
        <div>
          <div style="font-weight:500;font-size:14.5px;">${escapeHtml(currentUserEmail)}</div>
          <label class="link" for="avatar-input" style="cursor:pointer;">Change photo</label>
          <input type="file" id="avatar-input" accept="image/*" style="display:none;">
        </div>
      </div>
    </div>
    <div class="card">
      <h3>Appearance</h3>
      <div class="settings-row">
        <div>
          <div class="label">Dark mode</div>
          <div class="sub">Switch between light and dark appearance</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="theme-toggle" ${profile.theme==='dark'?'checked':''}>
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="card">
      <h3>Reports</h3>
      <label style="margin-top:0">Month</label>
      <select id="export-month">${months.map(m=>`<option value="${m}">${monthLabel(m)}</option>`).join('')}</select>
      <div class="row2">
        <button class="primary secondary-btn" id="export-csv-btn">Export CSV</button>
        <button class="primary" id="export-pdf-btn">Export PDF</button>
      </div>
    </div>
    <div class="card">
      <h3>History</h3>
      <label style="margin-top:0">View a past month</label>
      <select id="history-month">${months.map(m=>`<option value="${m}">${monthLabel(m)}</option>`).join('')}</select>
      <div id="history-detail"></div>
    </div>
    <div class="card">
      <h3>Month</h3>
      <p class="acct-sub" style="margin-bottom:12px;">Your data is always organised by month automatically — starting a new month doesn't delete anything, it just takes you to set a fresh budget.</p>
      <button class="primary secondary-btn" id="new-month-btn">Start new month</button>
    </div>
    <div class="card">
      <h3>Reset data</h3>
      <p class="acct-sub" style="margin-bottom:12px;">These actions can't be undone.</p>
      <div class="row2">
        <button class="primary danger" id="reset-month-btn">Reset this month</button>
        <button class="primary danger" id="reset-all-btn">Reset everything</button>
      </div>
    </div>
  `;

  document.getElementById('settings-avatar').innerHTML = profile.avatar_url
    ? `<img class="avatar-circle" style="width:52px;height:52px;" src="${profile.avatar_url}" alt="Profile photo">`
    : `<div class="avatar-circle" style="width:52px;height:52px;font-size:18px;">${initialsForUser()}</div>`;

  document.getElementById('avatar-input').addEventListener('change', e => {
    if(e.target.files[0]) uploadAvatar(e.target.files[0]);
  });
  document.getElementById('theme-toggle').addEventListener('change', async e => {
    const theme = e.target.checked ? 'dark' : 'light';
    applyTheme(theme);
    await saveProfile({ theme });
    toast(theme === 'dark' ? 'Dark mode on' : 'Light mode on');
  });
  document.getElementById('export-csv-btn').addEventListener('click', () => {
    exportMonthCSV(document.getElementById('export-month').value);
  });
  document.getElementById('export-pdf-btn').addEventListener('click', () => {
    exportMonthPDF(document.getElementById('export-month').value);
  });
  document.getElementById('history-month').addEventListener('change', e => renderHistoryFor(e.target.value));
  renderHistoryFor(months[0]);
  document.getElementById('new-month-btn').addEventListener('click', startNewMonth);
  document.getElementById('reset-month-btn').addEventListener('click', resetThisMonth);
  document.getElementById('reset-all-btn').addEventListener('click', resetAllData);
}

// ===================== PUSH NOTIFICATIONS =====================
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function setupPushNotifications(){
  const bell = document.getElementById('bell-btn');
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    bell.title = 'Push notifications not supported on this browser';
    return;
  }
  const reg = await navigator.serviceWorker.register('/sw.js');
  const existing = await reg.pushManager.getSubscription();
  if(existing){ bell.classList.add('subscribed'); }

  bell.onclick = async () => {
    try{
      const permission = await Notification.requestPermission();
      if(permission !== 'granted'){ toast('Notifications blocked — enable from browser settings'); return; }
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      const { data: userData } = await sb.auth.getUser();
      await sb.from('push_subscriptions').insert({ user_id: userData.user.id, subscription: sub.toJSON() });
      toast('Notifications on — reminders will now reach your phone directly');
      bell.classList.add('subscribed');
    }catch(e){
      toast('Could not enable notifications');
    }
  };
}
